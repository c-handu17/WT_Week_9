<!DOCTYPE html>
<html>
<head>
    <title>Loops</title>
</head>
<body>
    <h2>Multiplication Table of 7</h2>
    <div id="out1"></div>

    <script>
        let result1 = "";

        for (let i = 1; i <= 10; i++) {
            result1 += "7 x " + i + " = " + (7 * i) + "<br>";
        }

        document.getElementById("out1").innerHTML = result1;

       
    </script>
</body>
</html>
